<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Green Line Tokyo</title>
<meta name="description" content="가고 싶은 곳을 넣으면, 일요일·공휴일에 미터가 쉬는 도쿄 녹색 구간 중 걸어서 가장 가까운 주차 스폿을 지도로 바로 보여 줍니다.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Green Line">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 46'%3E%3Crect width='46' height='46' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23d7301b'/%3E%3Crect x='4' y='33' width='38' height='7' fill='%233cb043'/%3E%3Cpolygon points='30,6 42,26 30,26' fill='%23f6c500'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: a map app. Full-screen map; search bar floats on top; one answer card sits at the bottom
   (phone) or in a left column (desktop). Bauhaus: black rules, circle = place, square = parking. */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --ink: #111111;
  --mute: #5b5f66;
  --rule: #111111;
  --soft: #eceef1;
  --red: #d7301b;
  --blue: #1f4fb4;
  --yellow: #f6c500;
  --green: #1f8f3a;
  --green-line: #2fa83a;
  --on-yellow: #111111;
  --tile-filter: grayscale(.75) brightness(1.03) contrast(.95);
  --font-display: "Jost", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Hiragino Sans", "Apple SD Gothic Neo", "Yu Gothic", system-ui, sans-serif;
  --bw: 3px;
  --sheet-w: 400px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141517; --ink: #f1f1ef; --mute: #a3a8b0; --rule: #f1f1ef; --soft: #24262a;
    --red: #ff5b3f; --blue: #6b93ee; --yellow: #ffd21f; --green: #2f9c43; --green-line: #4fd15f;
    --tile-filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) grayscale(.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141517; --ink: #f1f1ef; --mute: #a3a8b0; --rule: #f1f1ef; --soft: #24262a;
  --red: #ff5b3f; --blue: #6b93ee; --yellow: #ffd21f; --green: #2f9c43; --green-line: #4fd15f;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) grayscale(.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; }
a { color: inherit; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Map */
#map { position: fixed; inset: 0; background: var(--soft); z-index: 0; }
@media (min-width: 900px) { #map { left: var(--sheet-w); } }
.leaflet-container { font-family: var(--font-body); background: var(--soft); }
.leaflet-tile-pane { filter: var(--tile-filter); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--paper) 85%, transparent) !important; color: var(--mute) !important; font-size: 10px !important; }
.leaflet-control-attribution a { color: var(--ink) !important; }
.leaflet-bottom { bottom: var(--sheet-h, 0px); }
@media (min-width: 900px) { .leaflet-bottom { bottom: 0; } }
.mk-p { width: 40px; height: 40px; background: var(--green); color: #fff; border: 3px solid var(--ink); display: grid; place-items: center; font: 700 22px/1 var(--font-display); box-shadow: 0 0 0 3px var(--yellow); }
.mk-alt { width: 24px; height: 24px; background: var(--paper); color: var(--ink); border: 3px solid var(--green); display: grid; place-items: center; font: 700 12px/1 var(--font-display); }
.mk-dest { width: 26px; height: 26px; border-radius: 50%; background: var(--red); border: 4px solid var(--paper); box-shadow: 0 0 0 2px var(--ink); }
.mk-me { width: 18px; height: 18px; border-radius: 50%; background: #2a6df4; border: 3px solid #fff; box-shadow: 0 0 0 2px #2a6df4; }
.leaflet-tooltip.tip-dest { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; box-shadow: none; font-weight: 700; font-size: 13px; padding: 2px 6px; }
.leaflet-tooltip.tip-dest::before { display: none; }
.leaflet-tooltip.tip-walk { background: var(--red); color: #fff; border: 0; border-radius: 0; box-shadow: none; font: 700 13px/1.2 var(--font-display); padding: 3px 7px; }
.leaflet-tooltip.tip-walk::before { display: none; }

/* Floating search bar */
.top { position: fixed; z-index: 1000; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
@media (min-width: 900px) { .top { right: auto; width: var(--sheet-w); padding: 16px; } }
.top > * { pointer-events: auto; }
.field { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: stretch; border: var(--bw) solid var(--rule); background: var(--paper); box-shadow: 6px 6px 0 var(--ink); }
.field .logo { display: grid; place-items: center; border-right: var(--bw) solid var(--rule); background: #111; }
.field input { min-width: 0; border: 0; background: transparent; color: var(--ink); font: 500 16px/1.3 var(--font-body); padding: 0 12px; min-height: 52px; }
.field input::placeholder { color: var(--mute); }
.field .x { border: 0; background: none; width: 44px; cursor: pointer; display: grid; place-items: center; color: var(--mute); }
.sugg { margin: 0; padding: 0; list-style: none; background: var(--paper); border: var(--bw) solid var(--rule); border-top: 0; max-height: min(52vh, 380px); overflow-y: auto; box-shadow: 6px 6px 0 var(--ink); }
.sugg li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; min-height: 50px; cursor: pointer; border-top: 1px solid var(--soft); }
.sugg li:first-child { border-top: 0; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--soft); }
.sugg .ic { width: 12px; height: 12px; background: var(--ink); justify-self: center; }
.sugg .ic.p { border-radius: 50%; background: var(--red); }
.sugg .ic.me { border-radius: 50%; background: #2a6df4; box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px #2a6df4; width: 10px; height: 10px; }
.sugg .ic.w { background: transparent; border: 3px solid var(--ink); border-radius: 50%; }
.sugg b { display: block; font-weight: 700; font-size: 15px; line-height: 1.3; }
.sugg small { display: block; color: var(--mute); font-size: 12px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sugg .info { cursor: default; color: var(--mute); font-size: 13px; grid-template-columns: 1fr; }
.msg { margin: 8px 0 0; padding: 8px 10px; background: var(--paper); border: 2px solid var(--red); color: var(--red); font-size: 13px; font-weight: 500; }

/* Map buttons */
.mapbtns { position: fixed; z-index: 900; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--sheet-h, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 900px) { .mapbtns { bottom: 28px; } }
.mapbtns button { width: 46px; height: 46px; border: var(--bw) solid var(--rule); background: var(--paper); cursor: pointer; display: grid; place-items: center; box-shadow: 4px 4px 0 var(--ink); }
.mapbtns button[aria-pressed="true"] { background: #2a6df4; color: #fff; }

/* Answer sheet */
.sheet { position: fixed; z-index: 950; left: 0; right: 0; bottom: 0; max-height: 54dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--paper); border-top: var(--bw) solid var(--rule); padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 900px) {
  .sheet { top: 0; right: auto; width: var(--sheet-w); max-height: none; border-top: 0; border-right: var(--bw) solid var(--rule); padding: 96px 20px 20px; }
}
.grab { display: flex; justify-content: center; padding: 8px 0 4px; border: 0; background: none; width: 100%; cursor: pointer; }
.grab i { width: 44px; height: 5px; background: var(--ink); }
@media (min-width: 900px) { .grab { display: none; } }
.sheet.min .more-body { display: none; }

.day { position: relative; display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; font-size: 13px; color: var(--mute); }
.day .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.day[data-k="sat"] .dot { background: var(--yellow); border-radius: 0; }
.day[data-k="paid"] .dot { background: var(--red); border-radius: 0; transform: rotate(45deg); }
.day label { position: relative; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); border-bottom: 2px solid var(--ink); cursor: pointer; min-height: 32px; }
.day input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }

.eyebrow { font: 500 12px/1.3 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0; }
.hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 0; }
.hero b { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.hero span { font-size: 15px; font-weight: 500; }
.to { margin: 4px 0 0; font-size: 14px; }
.to strong { font-weight: 700; }
.facts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.facts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.facts .ic { width: 14px; height: 14px; margin-top: 3px; justify-self: center; }
.facts .ic.car { background: var(--ink); }
.facts .ic.sign { background: var(--green); }
.facts .ic.walk { border-radius: 50%; background: var(--red); }
.facts small { color: var(--mute); }
.linkish { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: #2a6df4; }

.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 12px; border: var(--bw) solid var(--rule); background: var(--paper); color: var(--ink); font: 700 14px/1.2 var(--font-body); text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--soft); }
.btn.go { grid-column: 1 / -1; min-height: 54px; font-size: 16px; background: var(--ink); color: var(--paper); }
.btn.go:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn svg { flex: none; }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; border-top: 1px solid var(--soft); padding-top: 10px; }
.pager span { font-size: 13px; color: var(--mute); }
.pager .nav { display: flex; }
.pager .nav button { min-width: 44px; height: 40px; border: 2px solid var(--rule); background: var(--paper); cursor: pointer; font-weight: 700; font-size: 13px; padding: 0 10px; }
.pager .nav button + button { border-left: 0; }
.pager .nav button:disabled { opacity: .35; cursor: default; }

.warn { margin-top: 12px; background: var(--yellow); color: var(--on-yellow); border: 2px solid var(--ink); padding: 8px 10px; font-size: 13px; line-height: 1.45; }
.warn summary { cursor: pointer; font-weight: 700; list-style: none; }
.warn summary::-webkit-details-marker { display: none; }
.warn summary::after { content: " +"; }
.warn[open] summary::after { content: " −"; }
.warn p { margin: 6px 0 0; }
.signs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.sg { background: #fff; color: #111; border: 2px solid #111; padding: 4px 2px 6px; text-align: center; min-width: 0; }
.sg svg { display: block; width: 100%; height: auto; max-width: 110px; margin: 0 auto; }
.sg b { display: block; margin-top: 4px; font-size: 13px; }
.sg b.ok { color: #1f8f3a; }
.sg b.ng { color: #d7301b; }
.sg span { display: block; font-size: 11.5px; line-height: 1.35; padding: 0 3px; }
.warn .rule { margin-top: 8px; font-size: 12.5px; }

.start h2 { margin: 2px 0 6px; font: 700 26px/1.2 var(--font-body); text-wrap: balance; }
.start p { margin: 0 0 12px; color: var(--mute); font-size: 14px; }
.start .btn { width: 100%; }
.start .or { margin-top: 10px; font-size: 13px; color: var(--mute); }
.loading { padding: 18px 0; color: var(--mute); }

.credits { margin-top: 14px; font-size: 11.5px; color: var(--mute); line-height: 1.5; }
.credits a { text-underline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .sheet { transition: max-height .2s; } }
</style>
</head>
<body>
<div id="map" aria-label="지도"></div>

<div class="top">
  <form class="field" id="form" role="search" autocomplete="off">
    <span class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 46 46"><circle cx="16" cy="16" r="10" fill="#d7301b"/><rect x="4" y="33" width="38" height="7" fill="#3cb043"/><polygon points="30,6 42,26 30,26" fill="#f6c500"/></svg>
    </span>
    <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="어디 가세요?" aria-label="가고 싶은 곳"
           role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list" spellcheck="false">
    <button type="button" class="x" id="clear" aria-label="지우기" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.5"/></svg>
    </button>
  </form>
  <ul class="sugg" id="sugg" role="listbox" hidden></ul>
  <p class="msg" id="msg" hidden></p>
</div>

<div class="mapbtns">
  <button type="button" id="meBtn" aria-label="내 위치" aria-pressed="false">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="11" cy="11" r="2.5" fill="currentColor"/><path d="M11 1v4M11 17v4M1 11h4M17 11h4" stroke="currentColor" stroke-width="2.5"/></svg>
  </button>
  <button type="button" id="fitBtn" aria-label="스폿과 목적지 보기">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 7V2h5M15 2h5v5M20 15v5h-5M7 20H2v-5" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="8" y="8" width="6" height="6" fill="currentColor"/></svg>
  </button>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <button type="button" class="grab" id="grab" aria-label="카드 접기/펴기"><i></i></button>
  <div class="day" id="day" data-k="free">
    <i class="dot"></i>
    <label for="date"><span id="dayText">…</span>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><polygon points="1,3 9,3 5,8" fill="currentColor"/></svg>
      <input type="date" id="date" aria-label="날짜 바꾸기">
    </label>
    <span id="dayNote"></span>
  </div>
  <div id="body"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const STORE_KEY = 'glt.place.v1';
  const GEO_KEY = 'glt.geo.v1';
  const ROUTER = 'https://routing.openstreetmap.de/';
  const TOP_N = 5;            // spots offered
  const CHECK_N = 8;          // nearest by straight line, then ranked by real walking route
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wide = matchMedia('(min-width: 900px)');

  /* ---------- Japanese public holidays (祝日法, valid 2007–2099) ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const utc = (y, m, d) => new Date(Date.UTC(y, m - 1, d));
  function nthMonday(y, m, n) {
    const first = utc(y, m, 1).getUTCDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  }
  const holidayCache = new Map();
  function holidays(y) {
    if (holidayCache.has(y)) return holidayCache.get(y);
    const base = new Map();
    const add = (m, d, name) => base.set(ymd(utc(y, m, d)), name);
    const k = y - 1980;
    add(1, 1, '설날(元日)');
    add(1, nthMonday(y, 1, 2), '성인의 날');
    add(2, 11, '건국기념일');
    if (y >= 2020) add(2, 23, '일왕 생일');
    add(3, Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4)), '춘분의 날');
    add(4, 29, '쇼와의 날');
    add(5, 3, '헌법기념일');
    add(5, 4, '녹색의 날');
    add(5, 5, '어린이날');
    add(7, nthMonday(y, 7, 3), '바다의 날');
    add(8, 11, '산의 날');
    add(9, nthMonday(y, 9, 3), '경로의 날');
    add(9, Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4)), '추분의 날');
    add(10, nthMonday(y, 10, 2), '스포츠의 날');
    add(11, 3, '문화의 날');
    add(11, 23, '근로감사의 날');
    const all = new Map(base);
    for (const key of base.keys()) { // 国民の休日
      const d = new Date(key + 'T00:00:00Z');
      const mid = new Date(d.getTime() + 86400000);
      const next = new Date(d.getTime() + 2 * 86400000);
      if (!base.has(ymd(mid)) && base.has(ymd(next)) && mid.getUTCDay() !== 0) all.set(ymd(mid), '국민의 휴일');
    }
    for (const key of base.keys()) { // 振替休日
      const d = new Date(key + 'T00:00:00Z');
      if (d.getUTCDay() !== 0) continue;
      let n = new Date(d.getTime() + 86400000);
      while (all.has(ymd(n))) n = new Date(n.getTime() + 86400000);
      all.set(ymd(n), '대체휴일');
    }
    holidayCache.set(y, all);
    return all;
  }
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  function dayInfo(s) {
    const d = new Date(s + 'T00:00:00Z');
    const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, dd = d.getUTCDate(), w = d.getUTCDay();
    const hol = holidays(y).get(s) || null;
    let kind = 'weekday';
    if (m === 1 && dd <= 3) kind = 'newyear';
    else if (w === 0 || hol) kind = 'holiday';
    else if (w === 6) kind = 'sat';
    return { s, y, m, d: dd, w, hol, kind, text: m + '월 ' + dd + '일(' + WD[w] + ')' };
  }
  function todayTokyo() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return ymd(new Date()); }
  }
  function nextFreeDay(s) {
    let d = new Date(s + 'T00:00:00Z');
    for (let i = 0; i < 14; i++) {
      const info = dayInfo(ymd(d));
      if (info.kind === 'holiday' || info.kind === 'newyear') return info;
      d = new Date(d.getTime() + 86400000);
    }
    return dayInfo(s);
  }
  const isIdle = (z, kind) => z.c === 1 && (kind === 'newyear' || (kind === 'holiday' && z.r >= 1) || (kind === 'sat' && z.r === 2));

  /* ---------- geometry (local metres) ---------- */
  const M_LAT = 110950;
  const mLng = (lat) => 111320 * Math.cos(lat * Math.PI / 180);
  const straight = (a, b) => Math.hypot((a.lng - b.lng) * mLng((a.lat + b.lat) / 2), (a.lat - b.lat) * M_LAT);
  function nearestOnZone(z, p) {
    const kx = mLng(p.lat);
    let best = { d: Infinity };
    for (const line of z.l) {
      for (let i = 0; i < line.length; i++) {
        const ax = (line[i][0] - p.lng) * kx, ay = (line[i][1] - p.lat) * M_LAT;
        if (line.length === 1) { const d = Math.hypot(ax, ay); if (d < best.d) best = { d, x: ax, y: ay, hx: 0, hy: 1 }; continue; }
        if (i === line.length - 1) break;

    const acts = el('div', 'acts');
    acts.append(
      linkBtn(gDrive(s.n), '여기로 길안내', 'go', IC_CAR, '구글맵에서 이 주차 스폿까지 운전 길안내'),
      linkBtn(gPano(s.n), '표지 거리뷰', '', IC_EYE, '거리뷰로 현장 표지 확인'),
      linkBtn(gWalk(s.n, st.place), '도보 경로', '', IC_WALK, '구글맵에서 주차 스폿부터 목적지까지 도보 경로'),
    );
    body.append(acts);

    const more = el('div', 'more-body');
    const pager = el('div', 'pager');
    pager.append(el('span', '', '다른 스폿 ' + (st.sel + 1) + ' / ' + st.spots.length));
    const nav = el('div', 'nav');
    const pb = el('button', '', '◀ 이전'); pb.type = 'button'; pb.disabled = st.sel <= 0; pb.addEventListener('click', () => select(st.sel - 1, true));
    const nb = el('button', '', '다음 ▶'); nb.type = 'button'; nb.disabled = st.sel >= st.spots.length - 1; nb.addEventListener('click', () => select(st.sel + 1, true));
    nav.append(pb, nb);
    pager.append(nav);
    more.append(pager);

    more.append(signGuide());
    const cr = el('p', 'credits');
    cr.innerHTML = '주차 구간: 경시청 <a href="https://parking-meter.jp/" target="_blank" rel="noopener noreferrer">時間制限駐車区間 案内地図</a>(2026-11-23 받음). 지도: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">地理院タイル</a>. 경로: <a href="https://routing.openstreetmap.de/" target="_blank" rel="noopener noreferrer">FOSSGIS OSRM</a>, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>. 장소: Wikidata, Nominatim, 국토지리원.';
    more.append(cr);
    body.append(more);
    syncSheet();
  }
  $('grab').addEventListener('click', () => { $('sheet').classList.toggle('min'); syncSheet(); });

  /* ---------- sign guide (original drawings of the standard Japanese road signs) ---------- */
  const SG_POLE = '<rect x="46" y="8" width="8" height="182" fill="#8a8f96"/>';
  const SG_TIMED = (y) => '<g transform="translate(22 ' + y + ')"><rect width="56" height="64" fill="#1d5fb6" stroke="#fff" stroke-width="2"/>' +
    '<text x="28" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Jost,sans-serif">9-19</text>' +
    '<text x="28" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#fff" font-family="Jost,sans-serif">P</text>' +
    '<text x="28" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">60分</text></g>';
  const SG_SUB = (y, txt) => '<g transform="translate(8 ' + y + ')"><rect width="84" height="20" fill="#fff" stroke="#1d5fb6" stroke-width="2"/>' +
    '<text x="42" y="14" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d5fb6">' + txt + '</text></g>';
  const SG_NOPARK = (y) => '<g transform="translate(50 ' + y + ')"><circle r="27" fill="#1d5fb6" stroke="#d7301b" stroke-width="7"/>' +
    '<line x1="-17" y1="-17" x2="17" y2="17" stroke="#d7301b" stroke-width="7"/></g>';
  const SG_X = '<g transform="translate(78 14)"><circle r="13" fill="#d7301b"/><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#fff" stroke-width="3.5"/></g>';
  const SG_OK = '<g transform="translate(78 14)"><circle r="13" fill="#1f8f3a"/><path d="M-6 0L-2 5L7 -5" fill="none" stroke="#fff" stroke-width="3.5"/></g>';
  const svg = (inner, label) => '<svg viewBox="0 0 100 196" role="img" aria-label="' + label + '">' + inner + '</svg>';
  function signGuide() {
    const box = el('details', 'warn');
    box.open = true;
    box.append(el('summary', '', '도착하면 이 표지를 보세요'));
    const grid = el('div', 'signs');
    const card = (art, cls, verdict, text) => {
      const c = el('figure', 'sg');
      c.style.margin = '0';
      c.insertAdjacentHTML('afterbegin', art);
      c.append(el('b', cls, verdict), el('span', '', text));
      grid.append(c);
    };
    card(svg(SG_POLE + SG_TIMED(30) + SG_SUB(98, '日曜・休日を除く') + SG_OK, '세워도 되는 표지 조합'), 'ok', '세울 수 있음',
      'P 아래 「日曜・休日を除く」 → 휴일엔 미터가 쉼');
    card(svg(SG_POLE + SG_NOPARK(40) + SG_TIMED(74) + SG_SUB(142, '日曜・休日を除く') + SG_X, '세우면 안 되는 표지 조합'), 'ng', '세우면 안 됨',
      '빨간 사선 원(駐車禁止)이 같이 있으면 주차금지');
    card(svg(SG_POLE + SG_TIMED(30) + SG_X, '휴일에도 유료인 표지'), 'ng', '휴일도 유료',
      '「日曜・休日を除く」가 없으면 휴일에도 요금');
    box.append(grid);
    box.append(el('p', 'rule', '숫자(예: 9-19)는 미터를 쓰는 시간, 60分은 최대 주차 시간입니다. 같은 자리에 낮 12시간·밤 8시간 넘게 세우면 차고법 위반입니다.'));
    return box;
  }

  /* ---------- my location ---------- */
  function locate(userAction, asDestination) {
    if (!('geolocation' in navigator)) { showMsg('이 브라우저는 위치를 지원하지 않습니다.'); return; }
    $('meBtn').setAttribute('aria-pressed', 'true');
    navigator.geolocation.getCurrentPosition((pos) => {
      st.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      store.set(GEO_KEY, true);
      drawMe();
      if (asDestination) {
        if (!inTokyo(st.origin)) { showMsg('지금 위치가 도쿄 밖입니다. 가고 싶은 곳을 검색해 주세요.'); fitPts([[st.origin.lat, st.origin.lng]]); return; }
        setPlace({ label: '내 근처', sub: '', lat: st.origin.lat, lng: st.origin.lng, here: true }, false);
      } else {
        if (userAction && !st.place) fitPts([[st.origin.lat, st.origin.lng]]);
        render(); routeDrive();
      }
    }, (err) => {
      $('meBtn').setAttribute('aria-pressed', 'false');
      if (err.code === 1) { store.set(GEO_KEY, false); showMsg('위치 권한이 꺼져 있습니다. 아이폰: 설정 → 개인정보 보호 및 보안 → 위치 서비스 → Safari 웹 사이트 → 앱을 사용하는 동안.'); }
      else showMsg('위치를 찾지 못했습니다. 잠시 후 다시 눌러 주세요.');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
  $('meBtn').addEventListener('click', () => {
    if (st.origin) { fitPts([[st.origin.lat, st.origin.lng]]); locate(false, false); }
    else locate(true, false);
  });
  $('fitBtn').addEventListener('click', fitSpot);

  /* ---------- search ---------- */
  let cand = [], active = -1;
  function searchLocal(q) {
    const nq = norm(q);
    if (!nq) return [];
    const nqs = stripSuffix(nq) || nq;
    const fq = foldHangul(nqs);
    const scored = [];
    for (const e of st.index) {
      let best = 0;
      for (const k of e.keys) {
        let s = 0;
        if (k === nqs) s = 100;
        else if (k.startsWith(nqs)) s = 70 - Math.min(20, k.length - nqs.length);
        else if (nqs.length >= 2 && k.includes(nqs)) s = 40 - Math.min(20, k.length - nqs.length);
        if (s > best) best = s;
      }
      if (!best && /[가-힣]/.test(nqs)) {
        for (const k of e.fkeys) {
          if (k === fq) best = Math.max(best, 85);
          else if (k.startsWith(fq)) best = Math.max(best, 55);
          else if (fq.length >= 2 && k.includes(fq)) best = Math.max(best, 30);
        }
      }
      if (best) scored.push({ e, s: best + (e.p.k === 's' ? 6 : 0) });
    }
    scored.sort((a, b) => b.s - a.s || a.e.p.ja.length - b.e.p.ja.length);
    return scored.slice(0, 6).map((x) => ({ label: x.e.p.ko || x.e.p.ja, sub: [x.e.p.ko ? x.e.p.ja : '', x.e.p.en].filter(Boolean).join(' · '), lat: x.e.p.lat, lng: x.e.p.lng, kind: x.e.p.k }));
  }
  let webAbort = null, webTimer = 0;
  async function searchWeb(q) {
    if (webAbort) webAbort.abort();
    webAbort = new AbortController();
    const sig = webAbort.signal;
    const gsi = [], osm = [], tasks = [];
    if (/[぀-ヿ一-鿿0-9０-９]/.test(q)) {
      tasks.push(fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q), { signal: sig })
        .then((r) => r.ok ? r.json() : []).then((arr) => {
          for (const f of (Array.isArray(arr) ? arr : []).slice(0, 12)) {
            const c = f && f.geometry && f.geometry.coordinates;
            const title = String((f && f.properties && f.properties.title) || '');
            if (!c || !/^東京都/.test(title)) continue;
            gsi.push({ label: title.replace(/^東京都/, ''), sub: '주소', lat: +c[1], lng: +c[0], kind: 'w' });
          }
        }).catch(() => {}));
    }
    tasks.push(fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&bounded=1&viewbox=139.30,35.90,139.95,35.50&accept-language=ko,ja,en&q=' + encodeURIComponent(q), { signal: sig })
      .then((r) => r.ok ? r.json() : []).then((arr) => {
        for (const f of (Array.isArray(arr) ? arr : [])) {
          const p = { lat: +f.lat, lng: +f.lon };
          if (!inTokyo(p)) continue;
          const dn = String(f.display_name || '');
          osm.push({ label: String(f.name || '').trim() || dn.split(',')[0], sub: dn.split(',').slice(1, 4).join(',').trim(), lat: p.lat, lng: p.lng, kind: 'w' });
        }
      }).catch(() => {}));
    await Promise.all(tasks);
    if (sig.aborted) return null;
    const out = [];
    for (const c of gsi.concat(osm)) if (!out.some((o) => o.label === c.label && straight(o, c) < 300)) out.push(c);
    return out.slice(0, 6);
  }
  function showSugg(items, info) {
    const ul = $('sugg');
    ul.textContent = '';
    cand = items;
    items.forEach((p, i) => {
      const li = el('li');
      li.setAttribute('role', 'option');
      li.id = 'opt-' + i;
      const ic = el('i', 'ic' + (p.kind === 'me' ? ' me' : p.kind === 'w' ? ' w' : p.kind === 's' ? '' : ' p'));
      const tx = el('div');
      tx.style.minWidth = '0';
      tx.append(el('b', '', p.label));
      if (p.sub) tx.append(el('small', '', p.sub));
      li.append(ic, tx);
      li.addEventListener('pointerdown', (e) => { e.preventDefault(); choose(i); });
      ul.append(li);
    });
    if (info) { const li = el('li', 'info', info); ul.append(li); }
    active = items.length ? 0 : -1;
    markActive();
    ul.hidden = !ul.children.length;
    $('q').setAttribute('aria-expanded', String(!ul.hidden));
  }
  function markActive() {
    [...$('sugg').children].forEach((li, i) => li.setAttribute('aria-selected', String(i === active)));
    $('q').setAttribute('aria-activedescendant', active >= 0 ? 'opt-' + active : '');
  }
  function hideSugg() { $('sugg').hidden = true; $('q').setAttribute('aria-expanded', 'false'); }
  function showMsg(t) { const m = $('msg'); m.textContent = t; m.hidden = !t; if (t) setTimeout(() => { if (m.textContent === t) m.hidden = true; }, 7000); }
  function choose(i) {
    const p = cand[i];
    if (!p) return;
    hideSugg();
    $('q').blur();
    if (p.kind === 'me') { locate(true, true); return; }
    setPlace({ label: p.label, sub: p.sub || '', lat: p.lat, lng: p.lng }, true);
  }
  const ME_ITEM = { label: '지금 내 근처', sub: '현재 위치 주변의 무료 스폿', kind: 'me' };
  function onInput() {
    const v = $('q').value;
    $('clear').hidden = !v;
    showMsg('');
    clearTimeout(webTimer);
    if (!v.trim()) { showSugg([ME_ITEM]); return; }
    if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(v)) { hideSugg(); showMsg('짧은 구글맵 링크에는 좌표가 없습니다. 장소 이름으로 검색하거나 지도를 길게 눌러 주세요.'); return; }
    const c = parseCoords(v);
    if (c) {
      if (!inTokyo(c)) { hideSugg(); showMsg('도쿄 밖의 좌표입니다.'); return; }
      showSugg([{ label: '좌표 ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5), sub: '이 위치로 찾기', lat: c.lat, lng: c.lng, kind: 'w' }]);
      return;
    }
    const local = searchLocal(v);
    const q = v.trim();
    showSugg(local, local.length ? null : '찾는 중…');
    // online search: only after typing pauses, and only when the built-in list is thin
    if (local.length < 3 && q.length >= 2) {
      webTimer = setTimeout(async () => {
        const res = await searchWeb(q);
        if (res === null || $('q').value.trim() !== q) return;
        const merged = local.concat(res.filter((r) => !local.some((l) => straight(l, r) < 150)));
        showSugg(merged, merged.length ? null : '찾지 못했습니다. 다른 이름이나 일본어 주소(예: 銀座4丁目)로 찾거나 지도를 길게 누르세요.');
      }, 900);
    }
  }
  $('q').addEventListener('input', onInput);
  $('q').addEventListener('focus', () => { $('q').select(); onInput(); });
  $('q').addEventListener('blur', () => setTimeout(hideSugg, 150));
  $('q').addEventListener('keydown', (e) => {
    if ($('sugg').hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(cand.length - 1, active + 1); markActive(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); markActive(); }
    else if (e.key === 'Escape') hideSugg();
  });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); if (cand.length && active >= 0) choose(active); });
  $('clear').addEventListener('click', () => { $('q').value = ''; $('q').focus(); onInput(); });

  function setPlace(p, save) {
    st.place = p;
    $('q').value = p.here ? '' : p.label;
    $('q').placeholder = p.here ? '내 근처 · 다른 곳 검색' : '어디 가세요?';
    $('clear').hidden = !$('q').value;
    if (save) store.set(STORE_KEY, { label: p.label, sub: p.sub, lat: p.lat, lng: p.lng });
    $('sheet').classList.remove('min');
    findSpots();
  }

  /* ---------- boot ---------- */
  async function boot() {
    const today = todayTokyo();
    const t = dayInfo(today);
    st.day = (t.kind === 'holiday' || t.kind === 'newyear') ? t : nextFreeDay(today);
    renderDay();
    render();
    const saved = store.get(STORE_KEY);
    try {
      const zr = await fetch('zones.json');
      if (!zr.ok) throw new Error('zones ' + zr.status);
      st.zones = (await zr.json()).zones;
    } catch (e) {
      showMsg('주차 구간 데이터를 불러오지 못했습니다. 새로고침해 주세요.');
      return;
    }
    buildZones();
    if (saved && typeof saved.lat === 'number' && inTokyo(saved)) setPlace({ label: String(saved.label || ''), sub: String(saved.sub || ''), lat: saved.lat, lng: saved.lng }, false);
    if (store.get(GEO_KEY) === true) {
      try {
        const ps = navigator.permissions ? await navigator.permissions.query({ name: 'geolocation' }) : null;
        if (!ps || ps.state === 'granted') locate(false, false);
      } catch (e) { /* permissions API missing */ }
    }
    try {
      const pr = await fetch('places.json');
      if (!pr.ok) throw new Error('places ' + pr.status);
      const pj = await pr.json();
      st.places = pj.places.map((r) => ({ ja: r[0], ko: r[1], en: r[2], kana: r[3], lat: r[4], lng: r[5], k: r[6] }));
      st.index = st.places.map((p) => {
        const keys = [p.ja, p.ko, p.en, p.kana].filter(Boolean).map((s) => stripSuffix(norm(s.replace(/\s*[(（].*?[)）]\s*/g, ''))) || norm(s));
        return { p, keys: [...new Set(keys)], fkeys: p.ko ? [foldHangul(stripSuffix(norm(p.ko)))] : [] };
      });
    } catch (e) { /* online search still works */ }
  }
  boot();
})();
</script>
</body>
